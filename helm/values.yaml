global:
  imageRegistry: &imageRegistry ""
  imagePullSecrets: []
  storageClass: ""
  env:
    appEnv: production
    appDebug: "false"
    appUrl: "https://api.pro-motors.example.com"
    logLevel: error
    queueConnection: redis
    cacheStore: redis

image:
  api: &apiImage pro-motors-api:latest
  queue: &queueImage pro-motors-queue:latest
  scheduler: &schedulerImage pro-motors-scheduler:latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  api:
    port: 80
    targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.pro-motors.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pro-motors-api-tls
      hosts:
        - api.pro-motors.example.com

api:
  replicaCount: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

queue:
  replicaCount: 2
  command: "php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

scheduler:
  replicaCount: 1
  command: "sh -c 'sleep 5 && php /var/www/html/artisan schedule:work'"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

database:
  host: postgres
  port: 5432
  name: pro_motors
  username: root
  existingSecret: pro-motors-database
  secretKey: password

redis:
  host: redis
  port: 6379
  password: ""
  existingSecret: pro-motors-redis

meilisearch:
  host: meilisearch
  port: 7700
  masterKey: ""
  scoutDriver: meilisearch
  existingSecret: pro-motors-meilisearch

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
