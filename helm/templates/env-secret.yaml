apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pro-motors.fullname" . }}-env
  labels:
    {{- include "pro-motors.labels" . | nindent 4 }}
type: Opaque
stringData:
  .env: |
    APP_NAME=ProMotors
    APP_ENV={{ .Values.global.env.appEnv }}
    APP_KEY={{ .Values.global.env.appKey | default "" }}
    APP_DEBUG={{ .Values.global.env.appDebug }}
    APP_URL={{ .Values.global.env.appUrl }}
    
    DB_CONNECTION=pgsql
    DB_HOST={{ .Values.database.host }}
    DB_PORT={{ .Values.database.port | quote }}
    DB_DATABASE={{ .Values.database.name }}
    DB_USERNAME={{ .Values.database.username }}
    DB_PASSWORD={{ .Values.database.password | default "" }}
    
    QUEUE_CONNECTION={{ .Values.global.env.queueConnection }}
    CACHE_STORE={{ .Values.global.env.cacheStore }}
    SESSION_DRIVER=redis
    
    REDIS_HOST={{ .Values.redis.host }}
    REDIS_PORT={{ .Values.redis.port | quote }}
    REDIS_PASSWORD={{ .Values.redis.password | default "" }}
    
    SCOUT_DRIVER={{ .Values.meilisearch.scoutDriver }}
    MEILISEARCH_HOST=http://{{ .Values.meilisearch.host }}:{{ .Values.meilisearch.port }}
    MEILISEARCH_KEY={{ .Values.meilisearch.masterKey | default "" }}
