apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pro-motors.fullname" . }}-queue
  labels:
    {{- include "pro-motors.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue
spec:
  replicas: {{ .Values.queue.replicaCount }}
  selector:
    matchLabels:
      {{- include "pro-motors.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        {{- include "pro-motors.labels" . | nindent 8 }}
        app.kubernetes.io/component: queue
      annotations:
        {{- toYaml .Values.queue.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.queue.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-permissions
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /var/www/html/storage/logs
              mkdir -p /var/www/html/storage/framework/sessions
              mkdir -p /var/www/html/storage/framework/views
              mkdir -p /var/www/html/storage/framework/cache
              mkdir -p /var/www/html/storage/app/public
              mkdir -p /var/www/html/bootstrap/cache
              chmod -R 777 /var/www/html/storage
              chmod -R 777 /var/www/html/bootstrap
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: cache
              mountPath: /var/www/html/bootstrap/cache
      containers:
        - name: queue
          securityContext:
            {{- toYaml .Values.queue.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}{{ .Values.image.queue }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - {{ .Values.queue.command }}
          resources:
            {{- toYaml .Values.queue.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: cache
              mountPath: /var/www/html/bootstrap/cache
            - name: env
              mountPath: /var/www/html/.env
              subPath: .env
      volumes:
        - name: storage
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: env
          secret:
            secretName: {{ include "pro-motors.fullname" . }}-env
