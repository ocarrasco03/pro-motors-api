apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pro-motors.fullname" . }}-queue
  labels:
    {{- include "pro-motors.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue
spec:
  replicas: {{ .Values.queue.replicaCount }}
  selector:
    matchLabels:
      {{- include "pro-motors.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        {{- include "pro-motors.labels" . | nindent 8 }}
        app.kubernetes.io/component: queue
      annotations:
        {{- toYaml .Values.queue.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.queue.podSecurityContext | nindent 8 }}
      containers:
        - name: queue
          securityContext:
            {{- toYaml .Values.queue.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}{{ .Values.image.queue }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - {{ .Values.queue.command }}
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: APP_ENV
            - name: APP_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: APP_DEBUG
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: LOG_LEVEL
            - name: QUEUE_CONNECTION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: QUEUE_CONNECTION
            - name: CACHE_STORE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: CACHE_STORE
            - name: SCOUT_DRIVER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: SCOUT_DRIVER
            - name: DB_CONNECTION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: DB_CONNECTION
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: DB_PORT
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: redis-password
            - name: MEILISEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pro-motors.fullname" . }}-config
                  key: MEILISEARCH_HOST
            - name: MEILISEARCH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.meilisearch.existingSecret }}
                  key: master-key
          resources:
            {{- toYaml .Values.queue.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: cache
              mountPath: /var/www/html/bootstrap/cache
            - name: env
              mountPath: /var/www/html/.env
              subPath: .env
      volumes:
        - name: storage
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: env
          secret:
            secretName: {{ include "pro-motors.fullname" . }}-env
