apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pro-motors.fullname" . }}-config
  labels:
    {{- include "pro-motors.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.global.env.appEnv | quote }}
  APP_DEBUG: {{ .Values.global.env.appDebug | quote }}
  APP_URL: {{ .Values.global.env.appUrl | quote }}
  LOG_LEVEL: {{ .Values.global.env.logLevel | quote }}
  QUEUE_CONNECTION: {{ .Values.global.env.queueConnection | quote }}
  CACHE_STORE: {{ .Values.global.env.cacheStore | quote }}
  SCOUT_DRIVER: {{ .Values.meilisearch.scoutDriver | quote }}
  DB_CONNECTION: "pgsql"
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_DATABASE: {{ .Values.database.name | quote }}
  DB_USERNAME: {{ .Values.database.username | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  MEILISEARCH_HOST: "http://{{ .Values.meilisearch.host }}:{{ .Values.meilisearch.port }}"
